name: Ejecución de Colección Newman con Environment
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  newman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Ejecutar pruebas API
        run: |
          newman run "My_API_Test_Collection.postman_collection.json" \
            -e "Local Dev.postman_environment.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reporte-api.html

      - name: Subir Reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-newman-html
          path: reporte-api.html
