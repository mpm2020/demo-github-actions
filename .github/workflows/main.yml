name: Ejecución de Colección Newman con Environment
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  newman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      - name: Ejecutar pruebas API
        run: |
          newman run "My_API_Test_Collection.postman_collection.json" \
            -e "Local Dev.postman_environment.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reporte-api.html
      - name: Subir Reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-newman-html
          path: reporte-api.html
      - name: Enviar mail si pasó OK
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Tests OK - ${{ github.repository }}"
          to: mariana.montenegro77@gmail.com
          from: Tu Nombre <${{ secrets.MAIL_USERNAME }}>
          body: "Los tests de Newman corrieron correctamente en ${{ github.repository }}, branch ${{ github.ref_name }}."
      - name: Enviar mail si falló
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Tests FALLARON - ${{ github.repository }}"
          to: mariana.montenegro77@gmail.com
          from: Tu Nombre <${{ secrets.MAIL_USERNAME }}>
          body: "Los tests de Newman fallaron en ${{ github.repository }}, branch ${{ github.ref_name }}. Ver detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
